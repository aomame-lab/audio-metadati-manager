services:
  audio-metadati-manager:
    build: .
    container_name: audio-metadati-manager
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Primary music mount — default: ./music (relative to project) -> /music in container.
      # For a persistent location outside the project, set MUSIC_PATH in .env to an absolute host path.
      # Example: MUSIC_PATH=/home/user/audio-metadati-manager/music
      # The ./music fallback creates a music folder in the project directory if .env is not configured.
      - /Users/macbookpro/Desktop/audio-metadati-manager-stabile/music:/music
      # Optional additional music mounts — each one gets its own stable container path.
      # To enable extra mounts, create a docker-compose.override.yml file (see docker-compose.extra.yml.example)
      # or uncomment the lines below and set MUSIC_PATH_2 / MUSIC_PATH_3 in .env.
      # - ${MUSIC_PATH_2}:/music-roots/music2
      # - ${MUSIC_PATH_3}:/music-roots/music3
      # Persistent application data (registered music folders + settings).
      # Survives container recreation and image rebuilds.
      - audio-data:/app/data
    environment:
      - AUDIO_LIBRARY_OVERRIDE=/music
      - AUDIO_MUSIC_ROOTS=music2:/music-roots/music2,music3:/music-roots/music3
      - AUDIO_DATA_DIR=/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "if (@file_get_contents('http://localhost:8000/api/config.php') === false) exit(1);"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  audio-data: