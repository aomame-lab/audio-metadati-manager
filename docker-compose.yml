services:
  audio-metadati-manager:
    build: .
    container_name: audio-metadati-manager
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Primary music mount — unchanged: MUSIC_PATH (host) -> /music.
      - ${MUSIC_PATH:-./music}:/music
      # Additional music mounts, mounted on different host disks if needed.
      # Each one lands on its own stable container path (/music-roots/musicN)
      # so a file is never reachable through two different roots.
      # Defaults point to the empty "docker-placeholder" folders: users who do
      # not need extra roots simply never touch MUSIC_PATH_2 / MUSIC_PATH_3.
      # create_host_path:false makes a wrong path fail loudly instead of
      # silently creating an empty directory.
      #
      # These mounts are read-write, like /music, because the application writes
      # the tags and the embedded cover INTO the audio files: mounting them "ro"
      # would make saving fail with "Read-only file system". If you only want to
      # browse those roots without editing them, add "read_only: true" to the
      # entry below.
      - type: bind
        source: ${MUSIC_PATH_2:-./docker-placeholder/music2}
        target: /music-roots/music2
        bind:
          create_host_path: false
      - type: bind
        source: ${MUSIC_PATH_3:-./docker-placeholder/music3}
        target: /music-roots/music3
        bind:
          create_host_path: false
      # Persistent application data (registered music folders + settings).
      # Survives container recreation and image rebuilds.
      - audio-data:/app/data
    environment:
      - AUDIO_LIBRARY_OVERRIDE=/music
      - AUDIO_MUSIC_ROOTS=music2:/music-roots/music2,music3:/music-roots/music3
      - AUDIO_DATA_DIR=/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "if (@file_get_contents('http://localhost:8000/api/config.php') === false) exit(1);"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  audio-data:
